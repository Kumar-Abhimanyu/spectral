[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-observability"
version = "0.1.0"
description = "Local LLM trace storage and observability summaries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.50,<3"]

[project.scripts]
spectral = "spectral.cli:main"

[tool.setuptools.packages.find]
include = ["spectral*"]
namespaces = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
